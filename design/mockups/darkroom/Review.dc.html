<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Darkroom side-by-side review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #141312; color: #F2EEE8; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding-left: 14px; gap: 10px; border-bottom: 1px solid #292623">
    <svg viewBox="0 0 256 256" aria-hidden="true" style="width: 22px; height: 22px; display: block"><rect x="16" y="16" width="224" height="224" rx="52" fill="#292623"></rect><path d="M128 77.4 A56 56 0 0 1 128 178.6 A56 56 0 0 1 128 77.4 Z" fill="#F5A524"></path><circle cx="104" cy="128" r="56" fill="none" stroke="#F2EEE8" stroke-width="14"></circle><circle cx="152" cy="128" r="56" fill="none" stroke="#F2EEE8" stroke-width="14"></circle></svg>
    <span style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; margin-right: 20px">doubletake</span>
    <nav aria-label="Main" style="display: flex; gap: 4px; height: 48px; align-items: stretch">
      <a href="Scan.dc.html" style="padding: 0 14px; display: flex; align-items: center; color: #B5ADA2; text-decoration: none">Scan</a>
      <a href="#review" aria-current="page" style="position: relative; padding: 0 14px; display: flex; align-items: center; color: #F2EEE8; font-weight: 600; text-decoration: none">Review<span style="position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: #F5A524"></span></a>
      <a href="#history" style="padding: 0 14px; display: flex; align-items: center; color: #B5ADA2; text-decoration: none">History</a>
    </nav>
    <div style="flex-grow: 1"></div>
    <button aria-label="Settings" style="width: 36px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #B5ADA2; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h9M16 6h1M3 14h1M8 14h9"></path><circle cx="14" cy="6" r="2"></circle><circle cx="6" cy="14" r="2"></circle></svg></button>
    <button aria-label="Minimise" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
    <button aria-label="Maximise" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
    <button aria-label="Close" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <aside aria-label="Groups" style="width: 248px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #292623; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
      <div style="padding: 4px 8px 8px; font-size: 12px; color: #B5ADA2; display: flex; justify-content: space-between"><span>214 groups, largest first</span><span>11 done</span></div>
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="8">
        <button aria-pressed="{{q.on}}" style="height: 64px; border: 0; border-radius: 8px; background: {{q.bg}}; color: #F2EEE8; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 10px">
          <span style="position: relative; width: 62px; height: 44px; flex-shrink: 0">
            <span style="position: absolute; left: 0; top: 0; width: 46px; height: 34px; border-radius: 4px; background: {{q.hill}}; opacity: 0.6"></span>
            <span style="position: absolute; left: 14px; top: 9px; width: 46px; height: 34px; border-radius: 4px; overflow: hidden; outline: 2px solid {{q.bg2}}">
              <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><rect width="120" height="90" fill="{{q.sky}}"></rect><circle cx="{{q.sx}}" cy="26" r="9" fill="{{q.sun}}"></circle><path d="M0 90 L0 62 L34 38 L58 60 L82 44 L120 70 L120 90Z" fill="{{q.hill}}"></path><path d="M0 90 L0 76 L40 64 L78 78 L120 66 L120 90Z" fill="{{q.fore}}"></path></svg>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <span style="font-weight: 600">{{q.title}}</span>
            <span style="font-size: 12px; color: #B5ADA2">{{q.meta}}</span>
          </span>
          <sc-if value="{{q.on}}" hint-placeholder-val="{{false}}">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: #F5A524"></span>
          </sc-if>
        </button>
      </sc-for>
      <div style="flex-grow: 1"></div>
      <button style="height: 32px; border: 1px solid #5A544D; border-radius: 6px; background: #292623; color: #F2EEE8; font: inherit">Accept every suggestion</button>
    </aside>
    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="flex-grow: 1; min-height: 0; padding: 20px 24px 0; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: baseline; gap: 14px">
          <h1 style="margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Group 12 of 214</h1>
          <span style="color: #B5ADA2">Resized copy, 3 photos, 98% alike</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
          <sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
            <section style="display: flex; flex-direction: column; gap: 12px">
              <div style="position: relative; height: 300px; border-radius: 10px; overflow: hidden; outline: {{s.ring}}; outline-offset: -3px">
                <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><rect width="120" height="90" fill="#F4C7A1"></rect><circle cx="30" cy="26" r="9" fill="#FFF1C9"></circle><path d="M0 90 L0 62 L34 38 L58 60 L82 44 L120 70 L120 90Z" fill="#B5654A"></path><path d="M0 90 L0 76 L40 64 L78 78 L120 66 L120 90Z" fill="#6E3B32"></path></svg>
                <span style="position: absolute; left: 14px; top: 14px; height: 28px; padding: 0 12px; border-radius: 6px; background: {{s.tagBg}}; color: {{s.tagFg}}; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center">{{s.tag}}</span>
              </div>
              <div style="font-weight: 600">{{s.name}}</div>
              <dl style="margin: 0; display: grid; grid-template-columns: 96px 1fr; row-gap: 6px; font-size: 13px">
                <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
                  <dt style="color: #B5ADA2">{{r.k}}</dt>
                  <dd style="margin: 0; color: {{r.fg}}; font-weight: {{r.w}}">{{r.v}}</dd>
                </sc-for>
              </dl>
            </section>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="font-size: 12px; color: #B5ADA2; width: 96px">All 3 in this group</span>
          <sc-for list="{{strip}}" as="m" hint-placeholder-count="3">
            <button aria-pressed="{{m.shown}}" aria-label="{{m.label}}" style="position: relative; width: 96px; height: 72px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: transparent; outline: {{m.ring}}; outline-offset: 2px">
              <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; width: 100%; height: 100%"><rect width="120" height="90" fill="#F4C7A1"></rect><circle cx="30" cy="26" r="9" fill="#FFF1C9"></circle><path d="M0 90 L0 62 L34 38 L58 60 L82 44 L120 70 L120 90Z" fill="#B5654A"></path><path d="M0 90 L0 76 L40 64 L78 78 L120 66 L120 90Z" fill="#6E3B32"></path></svg>
              <span style="position: absolute; left: 4px; bottom: 4px; height: 18px; padding: 0 6px; border-radius: 4px; background: {{m.tagBg}}; color: {{m.tagFg}}; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center">{{m.tag}}</span>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="height: 56px; flex-shrink: 0; border-top: 1px solid #292623; display: flex; align-items: center; gap: 18px; padding: 0 16px 0 24px; font-size: 12px; color: #B5ADA2">
        <span style="display: flex; align-items: center; gap: 6px"><kbd style="font: inherit; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border: 1px solid #5A544D; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #F2EEE8">Left</kbd>keep left</span>
        <span style="display: flex; align-items: center; gap: 6px"><kbd style="font: inherit; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border: 1px solid #5A544D; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #F2EEE8">Right</kbd>keep right</span>
        <span style="display: flex; align-items: center; gap: 6px"><kbd style="font: inherit; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border: 1px solid #5A544D; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #F2EEE8">B</kbd>keep both</span>
        <span style="display: flex; align-items: center; gap: 6px"><kbd style="font: inherit; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border: 1px solid #5A544D; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #F2EEE8">Ctrl+Z</kbd>undo</span>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 14px; color: #F2EEE8">27 photos marked, 412 MB</span>
        <button style="height: 36px; padding: 0 18px; border: 0; border-radius: 8px; background: #F5A524; color: #1A1408; font: inherit; font-size: 14px; font-weight: 700">Recycle marked</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const sc = [
['#BFD9F2','#FFE08A','#5B8C6E','#2F5D50',88],['#F4C7A1','#FFF1C9','#B5654A','#6E3B32',30],['#CFE3E1','#FFFFFF','#7A9AA8','#3F5B6B',60],
['#E9D8F0','#FFD1DC','#8A6FA8','#4B3B6B',84],['#D9E8B8','#FFF4B0','#8DAA4F','#4F6B2A',40]
];
const q = (i, title, meta, on) => ({ title, meta, on, bg: on ? '#292623' : 'transparent', bg2: on ? '#292623' : '#141312', sky: sc[i][0], sun: sc[i][1], hill: sc[i][2], fore: sc[i][3], sx: sc[i][4] });
const better = { fg: '#F5A524', w: 600 }, same = { fg: '#F2EEE8', w: 400 };
return {
queue: [
q(0,'Group 11','3 exact, 8.4 MB',false), q(1,'Group 12','3 resized, 7.9 MB',true), q(2,'Group 13','3 recompressed, 5.2 MB',false),
q(3,'Group 14','2 exact, 4.8 MB',false), q(4,'Group 15','4 resized, 4.1 MB',false), q(0,'Group 16','2 exact, 3.9 MB',false),
q(2,'Group 17','2 recompressed, 3.3 MB',false), q(3,'Group 18','2 exact, 3.1 MB',false)
],
strip: [
{ tag: 'KEEP', tagBg: '#F5A524', tagFg: '#1A1408', shown: true, ring: '2px solid #F5A524', label: 'DSC_0117.JPG, shown left' },
{ tag: 'RECYCLE', tagBg: '#141312', tagFg: '#F2EEE8', shown: true, ring: '2px solid #F2EEE8', label: 'DSC_0117_small.jpg, shown right' },
{ tag: 'RECYCLE', tagBg: '#141312', tagFg: '#F2EEE8', shown: false, ring: '0 solid transparent', label: 'DSC_0117 (2).jpg' }
],
sides: [
{ name: 'DSC_0117.JPG', tag: 'KEEP', tagBg: '#F5A524', tagFg: '#1A1408', ring: '3px solid #F5A524',
  rows: [{k:'Resolution',v:'6000 x 4000',...better},{k:'File size',v:'9.1 MB',...better},{k:'Taken',v:'2 August 2023, 18:04',...same},{k:'Folder',v:'D:\\Photos\\2023\\Karoo',...same}] },
{ name: 'DSC_0117_small.jpg', tag: 'RECYCLE', tagBg: '#141312', tagFg: '#F2EEE8', ring: '0 solid transparent',
  rows: [{k:'Resolution',v:'1600 x 1067',...same},{k:'File size',v:'0.6 MB',...same},{k:'Taken',v:'2 August 2023, 18:04',...same},{k:'Folder',v:'C:\\Users\\Sam\\Pictures\\To share',...same}] }
]
};
}
}
</script>
</body>
</html>
