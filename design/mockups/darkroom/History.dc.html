<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Darkroom history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #141312; color: #F2EEE8; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding-left: 14px; gap: 10px; border-bottom: 1px solid #292623">
    <svg viewBox="0 0 256 256" aria-hidden="true" style="width: 22px; height: 22px; display: block"><rect x="16" y="16" width="224" height="224" rx="52" fill="#292623"></rect><path d="M128 77.4 A56 56 0 0 1 128 178.6 A56 56 0 0 1 128 77.4 Z" fill="#F5A524"></path><circle cx="104" cy="128" r="56" fill="none" stroke="#F2EEE8" stroke-width="14"></circle><circle cx="152" cy="128" r="56" fill="none" stroke="#F2EEE8" stroke-width="14"></circle></svg>
    <span style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; margin-right: 20px">doubletake</span>
    <nav aria-label="Main" style="display: flex; gap: 4px; height: 48px; align-items: stretch">
      <a href="Scan.dc.html" style="padding: 0 14px; display: flex; align-items: center; color: #B5ADA2; text-decoration: none">Scan</a>
      <a href="Review.dc.html" style="padding: 0 14px; display: flex; align-items: center; color: #B5ADA2; text-decoration: none">Review</a>
      <a href="#history" aria-current="page" style="position: relative; padding: 0 14px; display: flex; align-items: center; color: #F2EEE8; font-weight: 600; text-decoration: none">History<span style="position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: #F5A524"></span></a>
    </nav>
    <div style="flex-grow: 1"></div>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 36px; height: 32px; border-radius: 6px; color: #B5ADA2; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 20 20" aria-hidden="true" style="width: 18px; height: 18px" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h9M16 6h1M3 14h1M8 14h9"></path><circle cx="14" cy="6" r="2"></circle><circle cx="6" cy="14" r="2"></circle></svg></a>
    <button aria-label="Minimise" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
    <button aria-label="Maximise" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
    <button aria-label="Close" style="width: 46px; height: 48px; border: 0; background: transparent; color: #F2EEE8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 10" aria-hidden="true" style="width: 10px; height: 10px"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></button>
  </div>
  <main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding-top: 40px">
    <div style="width: 920px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: baseline; gap: 16px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; flex-grow: 1">History</h1>
        <span style="color: #B5ADA2">5.1 GB freed in 3 clean-ups</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <section style="background: #1E1C1A; border-radius: 10px">
            <div style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 12px 0 20px">
              <div style="width: 220px; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.date}}</span><span style="font-size: 12px; color: #B5ADA2">{{r.time}}</span></div>
              <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span>{{r.what}}</span><span style="font-size: 12px; color: #B5ADA2">{{r.where}}</span></div>
              <span style="font-size: 12px; color: #B5ADA2">{{r.state}}</span>
              <sc-if value="{{r.canRestore}}" hint-placeholder-val="{{true}}">
                <button style="height: 32px; padding: 0 14px; border: 1px solid #5A544D; border-radius: 6px; background: #292623; color: #F2EEE8; font: inherit">Restore</button>
              </sc-if>
              <button aria-expanded="{{r.open}}" aria-label="Show files" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #B5ADA2; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 10 6" aria-hidden="true" style="width: 10px; height: 6px; transform: {{r.chev}}"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
            </div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
              <div style="border-top: 1px solid #292623; padding: 8px 20px 12px">
                <sc-for list="{{r.files}}" as="f" hint-placeholder-count="4">
                  <div style="height: 32px; display: flex; align-items: center; gap: 16px; font-size: 13px">
                    <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.path}}</span>
                    <span style="color: #B5ADA2">{{f.size}}</span>
                    <span style="width: 150px; color: #B5ADA2">kept {{f.kept}}</span>
                  </div>
                </sc-for>
                <div style="height: 32px; display: flex; align-items: center; font-size: 13px; color: #B5ADA2">and 323 more</div>
              </div>
            </sc-if>
          </section>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button style="height: 32px; padding: 0 14px; border: 1px solid #5A544D; border-radius: 6px; background: #292623; color: #F2EEE8; font: inherit">Open Recycle Bin</button>
        <span style="font-size: 12px; color: #B5ADA2">Restore puts every photo of a clean-up back where it was, while it is still in the Recycle Bin.</span>
      </div>
    </div>
  </main>
</div>
</x-dc>

  files: [
  { path: 'C:\\Users\\Sam\\Pictures\\To share\\DSC_0117_small.jpg', size: '0.6 MB', kept: 'DSC_0117.JPG' },

  { path: 'D:\\Photos\\Phone backup\\IMG_4821 copy.HEIC', size: '4.2 MB', kept: 'IMG_4821.HEIC' },
  { path: 'E:\\Archive\\2019\\WhatsApp 2023-08-02.jpg', size: '0.3 MB', kept: 'P1040233.JPG' }
  ] },
{ date: '3 October 2026', time: '09:02', what: '112 photos moved to the Recycle Bin, 1.1 GB', where: '1 folder scanned', state: 'Restored 4 October', canRestore: false, open: false, chev: 'none', files: [] },
{ date: '28 August 2026', time: '18:40', what: '19 photos moved to the Recycle Bin, 212 MB', where: '2 folders scanned', state: 'Recycle Bin emptied', canRestore: false, open: false, chev: 'none', files: [] }

}
}
</script>
</body>
</html>
